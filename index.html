<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="NOVA AI — премиальный локальный фоторедактор для Telegram Mini App" />
  <title>NOVA AI — Photo Studio</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

  <style>
    /* ============================================
       NOVA AI — Premium Telegram Mini App Styles
       Dark Glassmorphism Design System
       ============================================ */

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-elevated: #1a1a24;
      --bg-glass: rgba(26, 26, 36, 0.72);
      --bg-glass-strong: rgba(20, 20, 30, 0.88);
      
      --accent: #a855f7;
      --accent-2: #6366f1;
      --accent-3: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #3b82f6 100%);
      --accent-glow: 0 0 24px rgba(168, 85, 247, 0.35);
      
      --text-primary: #f4f4f8;
      --text-secondary: #a1a1b5;
      --text-muted: #6b6b80;
      
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --header-h: 56px;
      --toolbar-h: 72px;
      --bottom-h: 68px;
      
      --font: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg-primary);
      position: relative;
      overflow: hidden;
    }

    /* ========== HEADER ========== */
    .header {
      height: calc(var(--header-h) + var(--safe-top));
      padding: var(--safe-top) 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-glass-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      box-shadow: var(--accent-glow);
    }

    .logo-text {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.3px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-right {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .icon-btn:hover,
    .icon-btn:active {
      background: rgba(255,255,255,0.08);
      color: var(--text-primary);
    }

    .icon-btn:disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    /* ========== MAIN ========== */
    .main {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding-bottom: var(--safe-bottom);
    }

    .screen.active {
      display: flex;
    }

    /* ========== HOME ========== */
    .hero {
      text-align: center;
      padding: 36px 24px 28px;
      position: relative;
    }

    .hero-glow {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      height: 180px;
      background: radial-gradient(ellipse, rgba(168,85,247,0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-title {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.5;
    }

    .home-actions {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
      color: inherit;
      width: 100%;
    }

    .action-card:active {
      transform: scale(0.98);
      border-color: var(--border-strong);
    }

    .action-card.primary {
      background: linear-gradient(135deg, rgba(168,85,247,0.18), rgba(99,102,241,0.12));
      border-color: rgba(168,85,247,0.3);
    }

    .action-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .action-icon.create {
      color: var(--accent-3);
    }

    .action-title {
      display: block;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 2px;
    }

    .action-desc {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
    }

    .section-block {
      padding: 28px 16px 8px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .text-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 8px;
    }

    .gallery-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .gallery-scroll::-webkit-scrollbar {
      display: none;
    }

    .gallery-item {
      width: 88px;
      height: 88px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ideas-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .idea-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
      transition: var(--transition);
    }

    .idea-card:active {
      transform: scale(0.96);
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .idea-preview {
      width: 100%;
      height: 56px;
      border-radius: 10px;
    }

    .gradient-preview {
      background: linear-gradient(135deg, #a855f7, #3b82f6, #06b6d4);
    }

    .neon-preview {
      background: radial-gradient(circle at 30% 40%, #f0abfc, transparent 50%),
                  radial-gradient(circle at 70% 60%, #22d3ee, transparent 50%),
                  #0f0f1a;
    }

    .cosmic-preview {
      background: radial-gradient(ellipse at 20% 30%, #4c1d95, transparent 50%),
                  radial-gradient(ellipse at 80% 70%, #1e3a8a, transparent 50%),
                  #050510;
    }

    .geo-preview {
      background: 
        linear-gradient(45deg, #6366f1 25%, transparent 25%),
        linear-gradient(-45deg, #a855f7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #3b82f6 75%),
        linear-gradient(-45deg, transparent 75%, #8b5cf6 75%);
      background-size: 20px 20px;
      background-color: #12121a;
    }

    .abstract-preview {
      background: 
        radial-gradient(circle at 20% 80%, #ec4899 0%, transparent 40%),
        radial-gradient(circle at 80% 20%, #8b5cf6 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #06b6d4 0%, transparent 50%),
        #0a0a12;
    }

    .poster-preview {
      background: linear-gradient(180deg, #1e1b4b 0%, #312e81 40%, #4c1d95 100%);
    }

    /* ========== EDITOR ========== */
    #screen-editor {
      background: #050508;
    }

    .editor-workspace {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .canvas-container {
      position: relative;
      max-width: 100%;
      max-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #main-canvas,
    #compare-canvas {
      max-width: 100%;
      max-height: calc(100vh - var(--header-h) - var(--toolbar-h) - var(--bottom-h) - 120px - var(--safe-top) - var(--safe-bottom));
      border-radius: 4px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      display: block;
    }

    .compare-overlay {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .compare-overlay canvas {
      position: absolute;
      top: 0;
      left: 0;
      clip-path: inset(0 50% 0 0);
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 12px;
    }

    .empty-icon {
      font-size: 48px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* Toolbar */
    .toolbar {
      height: var(--toolbar-h);
      background: var(--bg-glass-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      overflow: hidden;
    }

    .toolbar-scroll {
      display: flex;
      height: 100%;
      overflow-x: auto;
      padding: 0 8px;
      gap: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .toolbar-scroll::-webkit-scrollbar {
      display: none;
    }

    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 68px;
      height: 100%;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      padding: 0 6px;
    }

    .tool-btn svg {
      opacity: 0.7;
    }

    .tool-btn.active {
      color: var(--accent);
    }

    .tool-btn.active svg {
      opacity: 1;
      filter: drop-shadow(0 0 6px rgba(168,85,247,0.5));
    }

    /* Panels */
    .panels {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      max-height: 220px;
      overflow: hidden;
    }

    .panel {
      display: none;
      padding: 14px 16px 16px;
      overflow-y: auto;
      max-height: 220px;
    }

    .panel.active {
      display: block;
    }

    .panel-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .slider-header label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .slider-value {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--accent);
      min-width: 36px;
      text-align: right;
    }

    .slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.1);
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-gradient);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(168,85,247,0.4);
      border: 2px solid #fff;
    }

    .slider::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-gradient);
      cursor: pointer;
      border: 2px solid #fff;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }

    .chip:active,
    .chip.active {
      background: rgba(168,85,247,0.2);
      border-color: rgba(168,85,247,0.45);
      color: var(--text-primary);
    }

    /* Filters */
    .filters-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .filter-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      padding: 0;
    }

    .filter-preview {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      border: 2px solid transparent;
      transition: var(--transition);
    }

    .filter-btn.active .filter-preview,
    .filter-btn:active .filter-preview {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(168,85,247,0.3);
    }

    /* Effects */
    .effects-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .effect-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 6px;
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      transition: var(--transition);
    }

    .effect-btn:active,
    .effect-btn.active {
      border-color: var(--accent);
      background: rgba(168,85,247,0.12);
      color: var(--text-primary);
    }

    .effect-icon {
      font-size: 22px;
      line-height: 1;
    }

    /* Text panel */
    .text-input-group {
      display: flex;
      gap: 8px;
    }

    .text-input-group input {
      flex: 1;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
    }

    .text-input-group input:focus {
      border-color: var(--accent);
    }

    .btn-sm {
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-sm.primary {
      background: var(--accent-gradient);
      color: #fff;
    }

    .color-row,
    .font-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .color-row > label {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .color-presets {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
    }

    .color-swatch.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(168,85,247,0.35);
    }

    #text-color-picker {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      padding: 0;
      background: none;
      cursor: pointer;
    }

    .font-row {
      flex-direction: row;
      flex-wrap: wrap;
    }

    .font-btn {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
    }

    .font-btn.active {
      background: rgba(168,85,247,0.15);
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .text-layers {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .text-layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-elevated);
      border-radius: 10px;
      font-size: 13px;
    }

    .text-layer-item button {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    /* Transform */
    .transform-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .transform-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 14px 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      transition: var(--transition);
    }

    .transform-btn:active {
      border-color: var(--accent);
      color: var(--text-primary);
      background: rgba(168,85,247,0.1);
    }

    .crop-presets {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Bottom Bar */
    .bottom-bar {
      height: calc(var(--bottom-h) + var(--safe-bottom));
      padding: 0 12px var(--safe-bottom);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var
